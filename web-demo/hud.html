<style>
  .hud{position:fixed;font:600 13px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;color:#eef2ff;z-index:10}
  .glass{background:rgba(14,17,24,.92);border:1px solid #262c3a;border-radius:16px}
  #top{top:12px;left:12px;right:84px;pointer-events:none}
  #pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:20px;max-width:100%}
  #dot{width:9px;height:9px;border-radius:50%;flex:none}
  #feed{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:8px}
  .toast{padding:7px 11px;border-radius:12px;background:rgba(14,17,24,.94);border:1px solid #262c3a;font-weight:700;animation:in .25s ease}
  .toast.good{border-color:#2f7d4a}.toast.bad{border-color:#8a2b3d;background:rgba(48,14,22,.94)}.toast.gold{border-color:#b38a1a;background:rgba(40,32,8,.94)}
  @keyframes in{from{opacity:0;transform:translateY(-6px)}}
  #side{top:12px;right:12px;display:flex;flex-direction:column;gap:8px}
  #side button,.chips button{font:inherit;color:#8a93a8;cursor:pointer}
  #side button{width:62px;padding:6px 0;border-radius:14px;display:flex;flex-direction:column;align-items:center;font-size:9px;font-weight:800}
  #side button span{font-size:18px}
  #side button.on{background:#00f0ff;border-color:#00f0ff;color:#000}
  #bottom{left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
  #stats{display:flex;align-items:center;padding:12px;gap:12px}
  #stats .sw{width:6px;align-self:stretch;border-radius:3px;background:#3dd6ff}
  .lbl{color:#8a93a8;font-size:10px;font-weight:800;letter-spacing:1.2px}
  .val{font-size:20px;font-weight:800}.val small{color:#8a93a8;font-size:14px}
  .chips{display:flex;gap:6px;align-items:center;margin-left:auto}
  .chips button{background:none;border:1px solid #3a4152;border-radius:10px;padding:4px 9px;font-weight:800}
  .chips button.on{background:#ffd23f;border-color:#ffd23f;color:#000}
  #panel{padding:8px 12px;max-height:24vh;overflow:auto}
  .lb,.bd{display:flex;align-items:center;gap:8px;padding:4px 0}
  .lb b{width:14px;color:#8a93a8}.lb i{width:10px;height:10px;border-radius:50%}.lb span,.bd span{flex:1}.lb em,.bd em{font-style:normal;font-weight:800}
  .bd{border-left:3px solid;padding-left:8px;margin:3px 0}
  .dim{color:#8a93a8;font-weight:500}
  .h{color:#8a93a8;font-size:10px;font-weight:800;letter-spacing:1.2px;margin:6px 0 2px}
  #hint{font-size:11px;color:#8a93a8;font-weight:500;text-align:center}
</style>
<div id="top" class="hud"><div id="pill" class="glass"><span id="dot"></span><span id="status">Loading…</span></div><div id="feed"></div></div>
<div id="side" class="hud">
  <button class="glass" data-mode="street"><span>🗺️</span>Street</button>
  <button class="glass" data-mode="gods"><span>🛰️</span>God's Eye</button>
  <button class="glass" data-mode="tilt"><span>🏙️</span>3D</button>
  <button class="glass" id="recenter"><span>🎯</span>Center</button>
</div>
<div id="bottom" class="hud">
  <div id="panel" class="glass"><div class="h">LEADERBOARD</div><div id="board"></div><div class="h">BADGES</div><div id="badges"></div></div>
  <div id="stats" class="glass">
    <div class="sw"></div>
    <div><div class="lbl">YOUR LAND</div><div class="val" id="land">0 m²</div></div>
    <div><div class="lbl">RANK</div><div class="val" id="rank">#1</div></div>
    <div class="chips"><span class="lbl">SPEED</span><button data-turbo="1">1×</button><button data-turbo="3">3×</button><button data-turbo="8">8×</button></div>
  </div>
  <div id="hint">Click the map to walk there · click a place to walk a lap around it</div>
</div>
